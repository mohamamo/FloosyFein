name: Build FloosyFein APK

on:
  workflow_dispatch:
  push:
    paths:
      - "FloosyFein_v1_full.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Extract project
        run: unzip -o FloosyFein_v1_full.zip

      - name: Build APK
        working-directory: FloosyFein_v1_full
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FloosyFein-debug
          path: FloosyFein_v1_full/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
